<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoscape: The Lost Signal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            border: 2px solid #111;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
        }
        .hud-item {
            margin-bottom: 5px;
        }
        #energy-bar {
            width: 200px;
            height: 15px;
            background: #222;
            border: 1px solid #00ffff;
            border-radius: 3px;
            overflow: hidden;
        }
        #energy-fill {
            width: 100%;
            height: 100%;
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-item">الطاقة (Energy)</div>
        <div id="energy-bar"><div id="energy-fill"></div></div>
        <div class="hud-item" style="margin-top: 10px;">النقاط: <span id="score-text">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // أبعاد الشاشة لتبدو كشاشة كمبيوتر وموبايل متناسقة
        canvas.width = 800;
        canvas.height = 600;

        // بيانات اللاعب (الروبوت)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            speed: 4,
            color: '#00ffff'
        };

        // نظام الطاقة والنبضات
        let energy = 100;
        let score = 0;
        let pulseRadius = 0;
        let maxPulseRadius = 250;
        let isLoweringPulse = false;
        let pulseOpacity = 0;

        // مدخلات الأزرار (الحركة)
        const keys = {};

        // كبسولات الطاقة العشوائية في الخريطة
        const pickups = [];
        function spawnPickup() {
            if (pickups.length < 5) {
                pickups.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: Math.random() * (canvas.height - 40) + 20,
                    radius: 6,
                    color: '#39ff14' // أخضر نيون فسفوري
                });
            }
        }

        // الاستماع للوحة المفاتيح
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // الاستماع للنقر لإطلاق النبضة الصدى
        window.addEventListener('mousedown', () => {
            if (energy >= 15 && pulseRadius === 0) {
                energy -= 15;
                pulseRadius = 1;
                pulseOpacity = 1;
                document.getElementById('energy-fill').style.width = energy + '%';
            }
        });

        // حركة الروبوت
        function movePlayer() {
            if (keys['w'] || keys['arrowup']) player.y -= player.speed;
            if (keys['s'] || keys['arrowdown']) player.y += player.speed;
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if (keys['d'] || keys['arrowright']) player.x += player.speed;

            // منع الخروج من حدود الشاشة
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
        }

        // تحديث منطق النبضة والتصادم
        function updateGame() {
            movePlayer();
            spawnPickup();

            // منطق توسيع وتلاشي النبضة الصوتية
            if (pulseRadius > 0) {
                if (!isLoweringPulse) {
                    pulseRadius += 15;
                    if (pulseRadius >= maxPulseRadius) {
                        isLoweringPulse = true;
                    }
                } else {
                    pulseOpacity -= 0.02;
                    if (pulseOpacity <= 0) {
                        pulseRadius = 0;
                        isLoweringPulse = false;
                    }
                }
            }

            // التحقق من جمع كبسولات الطاقة
            for (let i = pickups.length - 1; i >= 0; i--) {
                let dist = Math.hypot(player.x - pickups[i].x, player.y - pickups[i].y);
                if (dist < player.radius + pickups[i].radius) {
                    pickups.splice(i, 1);
                    energy = Math.min(100, energy + 20);
                    score += 10;
                    document.getElementById('energy-fill').style.width = energy + '%';
                    document.getElementById('score-text').innerText = score;
                }
            }
        }

        // رسم العناصر على الشاشة (الرؤية بالصدى)
        function drawGame() {
            // 1. عتمة كاملة للخلفية
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. رسم تأثير النبضة الصوتية (يكشف ما يمر به فقط)
            if (pulseRadius > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x, player.y, pulseRadius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 255, 255, ${pulseOpacity * 0.08})`;
                ctx.fill();
                
                // رسم خط النبضة المتوسع
                ctx.strokeStyle = `rgba(0, 255, 255, ${pulseOpacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // 3. رسم الموارد المتوهجة (تظهر فقط إذا كانت داخل مدى النبضة أو قريبة جداً)
            pickups.forEach(pickup => {
                let dist = Math.hypot(player.x - pickup.x, player.y - pickup.y);
                if (dist < pulseRadius || dist < 60) {
                    ctx.beginPath();
                    ctx.arc(pickup.x, pickup.y, pickup.radius, 0, Math.PI * 2);
                    ctx.fillStyle = pickup.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = pickup.color;
                    ctx.fill();
                    ctx.shadowBlur = 0; // إعادة التصفير
                }
            });

            // 4. رسم الروبوت (اللاعب) دائماً مرئي بشكل خفيف
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = player.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // الحلقة اللانهائية لتشغيل اللعبة (Game Loop)
        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // بدء التشغيل
        gameLoop();
    </script>
</body>
</html>
